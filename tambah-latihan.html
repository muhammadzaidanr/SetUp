<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Routine | SetUp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="row">
        <div class="col-12 col-md-4">
          <a class="brand" href="index.html">Set<span>Up</span></a>
        </div>

        <nav class="col-12 col-md-8">
          <ul>
            <li><a href="index.html">Beranda</a></li>
            <li><a href="detail-latihan.html">Detail Latihan</a></li>
            <li><a href="tambah-latihan.html">Tambah Routine</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <main class="container">
    <h1>Tambah Routine</h1>
    <p>Susun routine untuk sesi latihan berikutnya.</p>

    <form action="tambah-latihan.html" method="get" class="panel">
      <fieldset>
        <legend>Informasi Routine</legend>

        <div class="mb-3">
          <label for="nama-routine">Nama routine:</label>
          <input type="text" class="form-control" id="nama-routine" name="nama-routine" placeholder="Contoh: Upper Body A" required>
        </div>

        <div class="mb-3">
          <label for="hari-latihan">Hari latihan:</label>
          <select class="form-control" id="hari-latihan" name="hari-latihan" required>
            <option value="">Pilih hari</option>
            <option value="senin">Senin</option>
            <option value="selasa">Selasa</option>
            <option value="rabu">Rabu</option>
            <option value="kamis">Kamis</option>
            <option value="jumat">Jumat</option>
            <option value="sabtu">Sabtu</option>
            <option value="minggu">Minggu</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <legend>Susunan Gerakan</legend>

        <div class="mb-3">
          <label for="gerakan">Nama gerakan:</label>
          <select class="form-control" id="gerakan" name="gerakan" required>
            <option value="">Pilih gerakan</option>
            <option value="bicep-curls">Bicep Curls</option>
            <option value="shoulder-press">Shoulder Press</option>
            <option value="tricep-extensions">Tricep Extensions</option>
          </select>
        </div>

        <div class="row">
          <div class="col-12 col-md-4 mb-3">
            <label for="jumlah-set">Target set:</label>
            <input type="number" class="form-control" id="jumlah-set" name="jumlah-set" min="1" required>
          </div>

          <div class="col-12 col-md-4 mb-3">
            <label for="repetisi">Target repetisi per set:</label>
            <input type="number" class="form-control" id="repetisi" name="repetisi" min="1" required>
          </div>

          <div class="col-12 col-md-4 mb-3">
            <label for="beban">Target beban (kg):</label>
            <input type="number" class="form-control" id="beban" name="beban" min="0" step="0.5" required>
          </div>
        </div>

        <p>
          <button type="button" class="btn btn-secondary">Tambah Gerakan</button>
        </p>

        <div class="mb-3">
          <label for="catatan">Catatan routine:</label>
          <textarea class="form-control" id="catatan" name="catatan" rows="4" placeholder="Tulis petunjuk atau catatan untuk routine ini"></textarea>
        </div>
      </fieldset>

      <button type="submit" class="btn btn-warning">Simpan Routine</button>
      <a href="index.html" class="btn btn-secondary">Batal</a>
    </form>
  </main>

  <footer class="site-footer text-center">
    <p>SetUp — Catat latihan, pantau perkembangan.</p>
  </footer>
</body>
</html>
